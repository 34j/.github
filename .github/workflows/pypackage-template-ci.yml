name: Reusable pypackage-template CI

on:
  workflow_call:

jobs:
  python-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ">=3.11"
      - id: versions
        uses: 34j/python-dynamic-matrix-from-classifiers@v1.0.0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: j178/prek-action@v2.0.3
        with:
          extra-args: --all-files --skip project/

  test:
    needs: python-matrix
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    name: "Template: ${{ matrix.python-version }} - ${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v6
      - run: git config --global user.name actions-user
      - run: git config --global user.email action@github.com
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --no-python-downloads
        shell: bash
      - run: uv run pytest
        shell: bash

  copier:
    strategy:
      fail-fast: false
      matrix:
        script:
          - run: uv run python -m pytest
            dir: ""
            name: pytest
          - run: git init && git add . && uvx prek run -a --show-diff-on-failure --color=always
            dir: ""
            name: prek
          - run: uv run sphinx-build -M html . _build -W
            dir: docs
            name: docs
        extra_options:
          - project_name: Simple Package
            project_slug: simple-package
            value: ""
          - project_name: Simple CLI
            project_slug: simple-cli
            value: "--data 'has_cli=yes' --data 'cli_name=mycli'"
    runs-on: ubuntu-latest
    name: "Generated: ${{ matrix.script.name }} ${{ matrix.extra_options.project_name }}"
    steps:
      - uses: actions/checkout@v6
      - run: git config --global user.name actions-user
      - run: git config --global user.email action@github.com
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: |
          uvx copier copy \
          . \
          my-project \
          --UNSAFE \
          --data 'full_name=Bruno Alla' \
          --data 'email=action@github.com' \
          --data 'github_username=actions-user' \
          --data 'project_name=${{ matrix.extra_options.project_name }}' \
          --data 'project_slug=${{ matrix.extra_options.project_slug }}' \
          --data 'project_short_description=Just a great project' \
          --data 'open_source_license=MIT' \
          ${{ matrix.extra_options.value }} \
          --data 'initial_commit=yes' \
          --defaults
      - run: cat pyproject.toml
        working-directory: my-project
      - run: uv sync --group docs
        working-directory: my-project
      - run: ${{ matrix.script.run }}
        working-directory: my-project/${{ matrix.script.dir }}
