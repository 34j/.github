name: Reusable pypackage-template CI

on:
  workflow_call:

jobs:
  python-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ">=3.12"
      - id: versions
        uses: 34j/python-dynamic-matrix-from-classifiers@v1.0.0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: j178/prek-action@v2.0.3
        with:
          extra-args: --all-files --skip project/

  test:
    needs: python-matrix
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    name: "Template: ${{ matrix.python-version }} - ${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v6
      - run: git config --global user.name actions-user
      - run: git config --global user.email action@github.com
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --no-python-downloads
        shell: bash
      - run: uv run pytest
        shell: bash
