name: autofix.ci

on:
  workflow_call:
    inputs:
      publish_to_pypi:
        type: boolean
        default: true
      release:
        type: boolean
        default: true
      skip_project:
        type: boolean
        default: false
      configure_git:
        type: boolean
        default: false
      upload_coverage:
        type: boolean
        default: true
      tkinter:
        type: boolean
        default: false
      sync_command:
        type: string
        default: uv sync --all-extras --frozen
    outputs:
      released:
        description: Whether semantic-release created a release
        value: ${{ jobs.release.outputs.released }}
      tag:
        description: The semantic-release tag
        value: ${{ jobs.release.outputs.tag }}

jobs:
  python-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ">=3.12"
      - id: versions
        uses: 34j/python-dynamic-matrix-from-classifiers@v1.0.2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: ${{ inputs.sync_command }}
      - uses: j178/prek-action@v2.0.3
        with:
          extra-args: ${{ inputs.skip_project && '--all-files --skip project/' || '--all-files' }}
      # - uses: autofix-ci/action@v1
      #   if: success() || failure()
      #   with:
      #     fail-fast: false
      #     commit-message: "style(prek): run prek"

  test:
    needs: python-matrix
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: inputs.configure_git
        run: |
          git config --global user.name actions-user
          git config --global user.email action@github.com
      - id: python
        if: inputs.tkinter
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - if: inputs.tkinter
        run: echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - if: inputs.tkinter
        run: uv run --all-extras --frozen python -c "import tkinter"
      # https://github.com/scikit-image/scikit-image/pull/8316
      - if: contains(matrix.os, 'windows')
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "MPLBACKEND=Agg"
      - run: uv run --all-extras --frozen pytest
      - if: inputs.upload_coverage
        uses: codecov/codecov-action@v6

  release:
    if: inputs.release
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    concurrency: release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Checkout commit for release
        run: git checkout -B ${{ github.ref_name }} ${{ github.sha }}
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --all-extras --frozen
      - id: semantic-release-config
        name: Locate semantic-release configuration
        run: |
          path="$(uv run python - <<'PY'
          from pathlib import Path
          import packaging_34j

          print(Path(packaging_34j.__file__).with_name("semantic_release.toml"))
          PY
          )"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Test release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        if: github.ref_name != 'main'
        with:
          config_file: ${{ steps.semantic-release-config.outputs.path }}
          no_operation_mode: true
          github_token: noop
      - name: Release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        if: github.ref_name == 'main'
        id: release
        with:
          config_file: ${{ steps.semantic-release-config.outputs.path }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest@v4
        if: steps.release.outputs.released == 'true'
        with:
          subject-path: dist/*
      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        if: steps.release.outputs.released == 'true' && inputs.publish_to_pypi
        with:
          name: python-package-dist
          path: dist/
          if-no-files-found: error
      - name: Publish package distributions to GitHub Releases
        uses: python-semantic-release/publish-action@v10.5.3
        if: steps.release.outputs.released == 'true'
        with:
          config_file: ${{ steps.semantic-release-config.outputs.path }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
